<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="title desc">
  <title id="title">CBA Digital</title>
  <desc id="desc">Typography-driven CBA Digital wordmark in cream with muted gold accent.</desc>
  <defs>
    <style>
      .word { fill: #f3eee3; font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: -10px; }
      .sub { fill: #c7a55b; font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 13px; }
      .rule { stroke: #c7a55b; stroke-width: 5; stroke-linecap: round; opacity: .95; }
    </style>
  </defs>
  <g>
    <text class="word" x="12" y="105" font-size="116">CBA</text>
    <line class="rule" x1="405" y1="66" x2="680" y2="66" />
    <text class="sub" x="408" y="125" font-size="28">DIGITAL</text>
  </g>
</svg>
