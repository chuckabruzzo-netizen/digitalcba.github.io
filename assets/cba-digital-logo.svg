<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 96" role="img" aria-labelledby="title desc">
  <title id="title">CBA Digital</title>
  <desc id="desc">CBA Digital horizontal wordmark with CBA on the left and DIGITAL beneath a muted gold rule.</desc>
  <defs>
    <style>
      .cba { fill: #f3eee3; font-family: Arial Black, Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: -5px; }
      .digital { fill: #c7a55b; font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 8px; }
      .rule { stroke: #c7a55b; stroke-width: 3.5; stroke-linecap: square; }
    </style>
  </defs>
  <text class="cba" x="0" y="64" font-size="58">CBA</text>
  <line class="rule" x1="218" y1="41" x2="370" y2="41" />
  <text class="digital" x="219" y="71" font-size="13">DIGITAL</text>
</svg>
